<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Vault — Private & Capsule Vault</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-layout">

    <!-- Left Sidebar Navigation -->
    <aside class="app-sidebar">
        <div class="logo-area">
            <span class="logo-icon">🔒</span>
            <h2>MemoryVault</h2>
        </div>

        <nav class="sidebar-nav">
            <button id="navVault" class="nav-btn active"><span>📂</span> My Vault</button>
            <button id="navUploads" class="nav-btn"><span>📁</span> My Uploads</button>
            <button id="navCapsules" class="nav-btn"><span>⏳</span> Time Capsules</button>
        </nav>

        <div class="sidebar-footer">
            <!-- JavaScript dynamically injects Login/User badge here -->
            <div class="user-badge">
                <span class="status-dot"></span> Loading Session...
            </div>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <main class="main-content">
        <!-- Action / Controls Bar -->
        <section class="controls-bar">
            <button id="openUploadBtn" class="primary-btn">+ Create Memory</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search memories, tags, or voice notes...">
            </div>
        </section>

        <!-- Dynamic Content Grid -->
        <section id="memoryGrid" class="memory-grid">
            <!-- JavaScript will render cards here -->
        </section>
    </main>

    <!-- Upload & Memory Creation Modal (Hidden by default) -->
    <div id="uploadModal" class="modal hidden">
        <div class="glass-card" style="background: rgba(17, 24, 39, 0.95); border: 1px solid var(--border-color); padding: 2rem; border-radius: 16px; max-width: 500px; width: 90%; position: relative;">
            <button id="closeModalBtn" class="close-btn" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h3 style="margin-top: 0; color: white; margin-bottom: 1.5rem;">Add New Private Memory</h3>
            
            <form id="memoryForm">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="memoryTitle" style="display:block; margin-bottom:0.5rem; color:var(--text-secondary);">Title</label>
                    <input type="text" id="memoryTitle" placeholder="e.g., Summer Trip in Japan" required style="width: 100%; padding: 0.75rem; background: rgba(9,13,22,0.6); border: 1px solid var(--border-color); border-radius: 10px; color: white; outline: none;">
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="fileInput" style="display:block; margin-bottom:0.5rem; color:var(--text-secondary);">Choose Image / Video (.mp4)</label>
                    <input type="file" id="fileInput" accept="image/*,video/*" style="width: 100%; color: var(--text-secondary);">
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom:0.5rem; color:var(--text-secondary);">Voice Note Attachment</label>
                    <button type="button" id="recordVoiceBtn" class="secondary-btn" style="width: 100%; padding: 0.75rem; background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; color: #60a5fa; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 0.5rem;">🎙️ Record Voice Note</button>
                    <span id="voiceStatus" style="font-size: 0.85rem; color: var(--text-secondary);">Ready to record...</span>
                </div>

                <div class="form-group checkbox-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                    <input type="checkbox" id="isCapsule" style="width: 18px; height: 18px;">
                    <label for="isCapsule" style="color: white; cursor: pointer;">Lock in Time Capsule ⏳</label>
                </div>

                <div id="capsuleDateGroup" class="form-group hidden" style="margin-bottom: 1.5rem;">
                    <label for="unlockDate" style="display:block; margin-bottom:0.5rem; color:var(--text-secondary);">Unlock Date</label>
                    <input type="datetime-local" id="unlockDate" style="width: 100%; padding: 0.75rem; background: rgba(9,13,22,0.6); border: 1px solid var(--border-color); border-radius: 10px; color: white; outline: none;">
                </div>

                <button type="submit" class="submit-btn" style="width: 100%; padding: 0.75rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Save to Cloud Vault</button>
            </form>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="modal hidden">
        <div class="glass-card" style="background: rgba(17, 24, 39, 0.95); border: 1px solid var(--border-color); padding: 2rem; border-radius: 16px; max-width: 420px; width: 90%; text-align: center; position: relative;">
            <button id="closeShareBtn" class="close-btn" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h3 style="color: white; margin-top: 0;">Share Memory 🌐</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">Anyone with this secure link can view this memory item.</p>
            
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <input type="text" id="shareLinkInput" readonly style="flex: 1; padding: 0.75rem; background: rgba(9,13,22,0.6); border: 1px solid var(--border-color); border-radius: 10px; color: white; font-size: 0.85rem; outline: none;">
                <button id="copyLinkBtn" class="primary-btn" style="padding: 0.75rem 1rem; background: #3b82f6; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Copy</button>
            </div>
            
            <span id="copyStatus" style="color: #22c55e; font-size: 0.85rem; font-weight: 600;"></span>
        </div>
    </div>

    <!-- Supabase Client Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
